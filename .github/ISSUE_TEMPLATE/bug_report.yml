name: Bug report
description: Report a reproducible non-security problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private Codex configuration, or proprietary prompts. Report security issues privately using SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: codex_version
    attributes:
      label: Codex CLI version
      placeholder: codex-cli 0.154.0
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: MCP host
      placeholder: Codex, Claude Desktop, or another MCP client
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use placeholders and remove private data.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Verification output
      description: Summarize relevant offline or live checks without secrets.
